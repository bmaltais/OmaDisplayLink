# shellcheck shell=bash
# OmaDisplayLink's settings for the devkit (scripts/devkit, a submodule): the nested test session.
TOUR_PLUGIN_ID=io.github.bmaltais.omadisplaylink
DEVKIT_NAME=omadisplaylink
TOUR_TITLE=OmaDisplayLink
# Installing needs sudo and rebuilds a system library; a click in the session must never get that far.
DEVKIT_GUARD_EXTRA=(sudo makepkg)
TOUR_SANDBOX_LINK=(.local/share/icons)
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .config/uwsm/env-hyprland .config/hypr/monitors.lua .config/omarchy/hooks)

# The session shares your user's pacman and systemd. A marker file in its own home puts bin/omadisplaylink in demo mode
# (a fixed state, setup and doctor only print what they would do); the session refuses to start without it.
devkit_sandbox() {
  local h=$1
  mkdir -p "$h/.config/OmaDisplayLink"
  printf 'attention\n' >"$h/.config/OmaDisplayLink/demo"
  [[ -f $h/.config/OmaDisplayLink/demo ]] || { echo "the sandbox could not be put in demo mode" >&2; return 1; }
}

DEVKIT_USAGE='  dev state unconfigured|idle|ok|attention [patch|service]   change what the demo reports, then refresh
  (click the bar icon with dev click to open the card)'
dev_cmd_state() {
  case "${1:-}" in unconfigured | idle | ok | attention) ;; *) die "state needs unconfigured, idle, ok or attention" ;; esac
  printf '%s\n%s\n' "$1" "${2:-}" >"$NEST_HOME/.config/OmaDisplayLink/demo"
  nenv omarchy-shell "$ID" refresh >/dev/null
  echo "dev state: $1 ${2:-}"
}

# `reload` (the kit's): the service answers `state` once it is loaded; the card opens by clicking the icon.
DEVKIT_RELOAD_READY=state
reload_open() { die "the card opens by clicking the bar icon; there is no window to open"; }
